<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>BONEPILE — R3-W0RK 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030504;color:#c8c8c8;font-family:'Share Tech Mono',monospace;touch-action:none}
#game{position:fixed;inset:0;background:#020303}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top-hud{position:absolute;top:18px;left:18px;display:flex;gap:12px}
.stat{width:150px;background:rgba(5,8,8,.78);border:1px solid rgba(90,138,106,.75);padding:10px 12px;box-shadow:0 0 18px rgba(26,60,43,.25)}
.stat-label{color:#7fb18d;font-size:12px;letter-spacing:3px;margin-bottom:8px}
.bar{height:8px;background:#151817;overflow:hidden}.fill{height:100%;transition:width .2s}
#integrityFill{width:100%;background:#ff6b35}#signalFill{width:100%;background:#00a8ff}#riskFill{width:0%;background:#ff0033}
.title{position:absolute;top:18px;right:22px;text-align:right;color:#b87333;letter-spacing:3px;font-size:16px;text-shadow:0 0 8px rgba(184,115,51,.5)}
.subtitle{color:#5a8a6a;font-size:11px;margin-top:4px;letter-spacing:1px}
.log{position:absolute;left:18px;bottom:22px;width:min(620px,calc(100vw - 36px));min-height:52px;padding:12px 16px;background:rgba(5,8,8,.82);border-left:3px solid #ff6b35;color:#b8b8b8;font-size:14px;line-height:1.5}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(2,3,3,.84);text-align:center}
.main-title{font-size:70px;letter-spacing:12px;color:#cfcfcf;text-shadow:0 0 18px rgba(255,255,255,.16),0 8px 0 #191919}
.main-sub{margin-top:18px;padding-bottom:12px;border-bottom:1px solid #2a4a3a;color:#7fb18d;letter-spacing:6px;font-size:15px}
.quote{margin:35px 0;max-width:620px;color:#8a8a8a;font-style:italic;line-height:1.6}
button{font-family:'Share Tech Mono',monospace;background:rgba(5,8,8,.6);color:#ff6b35;border:1px solid #ff6b35;padding:14px 36px;letter-spacing:4px;font-size:15px;cursor:pointer}
button:active{background:rgba(255,107,53,.18)}
#touch{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}
#touch.visible{display:block}
.dpad{position:absolute;left:28px;bottom:28px;width:162px;height:162px;pointer-events:auto}
.touch-btn{position:absolute;width:58px;height:58px;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,107,53,.75);color:#ff6b35;background:rgba(6,8,8,.66);font-size:22px;user-select:none;-webkit-user-select:none}
#up{left:52px;top:0}#left{left:0;top:52px}#right{left:104px;top:52px}#down{left:52px;top:104px}
.actions{position:absolute;right:28px;bottom:34px;width:270px;height:150px;pointer-events:auto}
.action{position:absolute;width:92px;height:60px;border-radius:14px;border:1px solid rgba(90,138,106,.85);color:#7fb18d;background:rgba(6,8,8,.66);display:flex;justify-content:center;align-items:center;letter-spacing:3px;font-size:13px;user-select:none;-webkit-user-select:none}
#dash{right:108px;top:0}#flux{right:0;top:0;color:#00ff41;border-color:#00ff41}#use{right:54px;top:78px;color:#ff6b35;border-color:#ff6b35;width:120px}
.active{background:rgba(255,107,53,.25)!important;box-shadow:0 0 18px rgba(255,107,53,.45)}
.crt:before{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.14) 50%),linear-gradient(90deg,rgba(255,0,0,.022),rgba(0,255,0,.01),rgba(0,0,255,.022));background-size:100% 2px,3px 100%;opacity:.68}
@media (hover:none),(pointer:coarse),(max-width:900px){
  .main-title{font-size:48px;letter-spacing:8px}.top-hud{gap:8px;top:12px;left:12px}.stat{width:116px;padding:8px}.stat-label{font-size:10px;letter-spacing:2px}.title{display:none}.log{font-size:12px;bottom:12px;max-width:48vw}
}
</style>
</head>

<body class="crt">
<div id="game"></div>

<div id="hud">
  <div class="top-hud">
    <div class="stat"><div class="stat-label">INTEGRIDAD</div><div class="bar"><div class="fill" id="integrityFill"></div></div></div>
    <div class="stat"><div class="stat-label">SEÑAL</div><div class="bar"><div class="fill" id="signalFill"></div></div></div>
    <div class="stat"><div class="stat-label">RIESGO AOI</div><div class="bar"><div class="fill" id="riskFill"></div></div></div>
  </div>
  <div class="title">BONEPILE 3D PROTOTYPE<div class="subtitle">R3-W0RK // UNREGISTERED NODE</div></div>
  <div class="log" id="log">&gt; Inicializando WebGL. Esperando GLB.</div>
</div>

<div id="touch">
  <div class="dpad"><div class="touch-btn" id="up">▲</div><div class="touch-btn" id="left">◀</div><div class="touch-btn" id="right">▶</div><div class="touch-btn" id="down">▼</div></div>
  <div class="actions"><div class="action" id="dash">DASH</div><div class="action" id="flux">FLUX</div><div class="action" id="use">E / USE</div></div>
</div>

<div id="menu">
  <div class="main-title">BONEPILE</div>
  <div class="main-sub">// R3-W0RK GLB INTEGRATION //</div>
  <div class="quote">“No necesitamos ser perfectos. Solo necesitamos seguir funcionando.”<br>— R3-W0RK</div>
  <button id="startBtn">INICIAR 3D</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const container = document.getElementById('game');
const logBox = document.getElementById('log');
const menu = document.getElementById('menu');
const touch = document.getElementById('touch');
const keys = {};

let started = false;
let integrity = 100;
let signal = 100;
let risk = 0;
let fluxTimer = 0;
let playerReady = false;

function log(m){ logBox.innerHTML = '&gt; ' + m; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050807);
// FIX: fog menos agresivo para no oscurecer el modelo.
scene.fog = new THREE.FogExp2(0x050807, 0.018);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 150);
// FIX: cámara más cerca y centrada para validar escala del GLB.
camera.position.set(5.6, 4.8, 6.2);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// FIX: salida de color y exposición más visible en móvil.
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
container.appendChild(renderer.domElement);

// LIGHTING FIX: más luz ambiental + key light más fuerte.
scene.add(new THREE.HemisphereLight(0xb6cbb9, 0x111111, 2.35));

const keyLight = new THREE.DirectionalLight(0xffffff, 4.0);
keyLight.position.set(4, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 1.25);
fillLight.position.set(-5, 4, -3);
scene.add(fillLight);

const copperLight = new THREE.PointLight(0xff6b35, 4.0, 18);
copperLight.position.set(-3, 1.8, 2);
scene.add(copperLight);

const greenLight = new THREE.PointLight(0x00ff66, 2.0, 14);
greenLight.position.set(3, 1.2, -2);
scene.add(greenLight);

const redLight = new THREE.PointLight(0xff0033, 1.8, 14);
redLight.position.set(4, 2.2, -3);
scene.add(redLight);

// PCB floor.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(26, 26),
  new THREE.MeshStandardMaterial({ color:0x07110d, roughness:0.72, metalness:0.18 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(26, 26, 0x1a3c2b, 0x0e1f17);
grid.position.y = 0.012;
scene.add(grid);

function trace(x,z,sx,sz){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(sx, .035, sz),
    new THREE.MeshStandardMaterial({
      color:0xb87333, emissive:0x5a2508, emissiveIntensity:1.15,
      roughness:.35, metalness:.75
    })
  );
  m.position.set(x,.04,z);
  m.receiveShadow = true;
  scene.add(m);
}

trace(0,0,19,.12); trace(-4,2.8,.12,8); trace(4.2,-2.2,.12,7);
trace(2.2,3.5,7,.1); trace(-3.4,-3.6,6,.1); trace(0,-5.2,12,.09);

function chip(x,z,sx,sz){
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(sx,.28,sz),
    new THREE.MeshStandardMaterial({ color:0x1b1b1b, roughness:.85, metalness:.25 })
  );
  b.position.set(x,.16,z);
  b.castShadow = true;
  b.receiveShadow = true;
  scene.add(b);
}
chip(-5,-2.5,1.4,.9); chip(5.2,2.4,1.8,1.1); chip(0,4.4,2.2,.8);

// AOI placeholder.
const aoiGroup = new THREE.Group();
const aoiBody = new THREE.Mesh(
  new THREE.BoxGeometry(1.1,.45,.8),
  new THREE.MeshStandardMaterial({ color:0x444444, roughness:.45, metalness:.65 })
);
aoiBody.castShadow = true; aoiGroup.add(aoiBody);

const lens = new THREE.Mesh(
  new THREE.SphereGeometry(.16,24,16),
  new THREE.MeshStandardMaterial({ color:0xff0033, emissive:0xff0033, emissiveIntensity:3.0 })
);
lens.position.set(0,-.03,-.42); aoiGroup.add(lens);

const aoiLight = new THREE.SpotLight(0xff0033,5.2,9,Math.PI/7,.45,1.2);
aoiLight.position.set(0,-.1,-.45);
aoiLight.target.position.set(0,-1,-4);
aoiGroup.add(aoiLight); aoiGroup.add(aoiLight.target);
aoiGroup.position.set(3,2.2,-3);
scene.add(aoiGroup);

// Player container.
let player = new THREE.Group();
scene.add(player);

function createFallbackPlayer(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.4,.28,1.0),
    new THREE.MeshStandardMaterial({ color:0x2d2a24, roughness:.75, metalness:.42 })
  );
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const led = new THREE.Mesh(
    new THREE.SphereGeometry(.06,16,8),
    new THREE.MeshStandardMaterial({ color:0x00ff66, emissive:0x00ff66, emissiveIntensity:2 })
  );
  led.position.set(.35,.18,-.25); g.add(led);

  for(let i=0;i<8;i++){
    const pinL = new THREE.Mesh(
      new THREE.BoxGeometry(.08,.08,.18),
      new THREE.MeshStandardMaterial({ color:0xb9a383, roughness:.4, metalness:.9 })
    );
    pinL.position.set(-.8, -.05, -.42 + i*.12);
    g.add(pinL);

    const pinR = pinL.clone();
    pinR.position.x = .8;
    g.add(pinR);
  }
  return g;
}

// Fallback visible immediately so the scene never looks frozen.
const fallback = createFallbackPlayer();
fallback.position.set(0,.3,0);
player.add(fallback);
player.position.set(0,0,0);
log('Escena 3D activa. Cargando ./R3WORK.glb...');

// GLB loading with safe fallback.
const loader = new GLTFLoader();
loader.load('./R3WORK.glb',
  (gltf)=>{
    try{
      player.remove(fallback);
      const model = gltf.scene;

      model.traverse((o)=>{
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
          if(o.material){
            o.material.side = THREE.FrontSide;
            o.material.needsUpdate = true;
          }
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x,size.y,size.z) || 1;
      // FIX: modelo más grande para validación visual.
      const scale = 4.0 / maxDim;
      model.scale.setScalar(scale);

      // Recalcular centro después de escala, corregir posición al origen.
      const box2 = new THREE.Box3().setFromObject(model);
      const center2 = new THREE.Vector3();
      box2.getCenter(center2);
      model.position.sub(center2);
      model.position.y += 1.15;

      model.rotation.y = Math.PI;
      player.add(model);

      player.position.set(0,0,0);
      playerReady = true;
      log('R3-W0RK GLB cargado. Scale fix aplicado. Inicia secuencia.');
    }catch(e){
      console.error(e);
      log('GLB cargó, pero falló al procesar. Usando fallback SOIC.');
    }
  },
  (xhr)=>{
    if(xhr.total){
      const p = Math.round((xhr.loaded / xhr.total) * 100);
      log('Cargando R3WORK.glb... ' + p + '%');
    }
  },
  (err)=>{
    console.error(err);
    log('ERROR al cargar ./R3WORK.glb. Usando fallback. Verifica nombre exacto y mayúsculas.');
  }
);

addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

function bindTouch(id,code,tapFn=null){
  const el=document.getElementById(id);
  const down=e=>{e.preventDefault();el.classList.add('active');keys[code]=true;if(tapFn)tapFn()};
  const up=e=>{e.preventDefault();el.classList.remove('active');keys[code]=false};
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',down);
  el.addEventListener('mouseup',up);
  el.addEventListener('mouseleave',up);
}
bindTouch('up','KeyW'); bindTouch('left','KeyA'); bindTouch('right','KeyD'); bindTouch('down','KeyS');
bindTouch('dash','ShiftLeft'); bindTouch('flux','Space',()=>useFlux());
bindTouch('use','KeyE',()=>log('Rework interaction pending. Banco no conectado en v2.1.'));

document.addEventListener('touchmove', e=>{
  if(started) e.preventDefault();
},{passive:false});

document.getElementById('startBtn').addEventListener('click',()=>{
  started = true;
  menu.style.display = 'none';
  touch.classList.add('visible');
  log(playerReady ? 'Secuencia 3D iniciada. R3-W0RK operativo.' : 'Secuencia iniciada. GLB aún cargando o usando fallback.');
});

function useFlux(){
  if(!started) return;
  fluxTimer = 180;
  risk = Math.max(0, risk - 45);
  log('Flux cloud deployed. AOI optical confidence degraded.');
}

function hud(){
  document.getElementById('integrityFill').style.width = integrity + '%';
  document.getElementById('signalFill').style.width = signal + '%';
  document.getElementById('riskFill').style.width = risk + '%';
}

function animate(){
  requestAnimationFrame(animate);
  const t = performance.now() * .001;

  aoiGroup.position.x = 3 + Math.sin(t*.8)*2.4;
  aoiGroup.rotation.y = Math.sin(t*.8)*.6;
  copperLight.intensity = 3.3 + Math.sin(t*3)*.45;

  // Always rotate fallback/model subtly in menu so user sees 3D is alive.
  if(!started){
    player.rotation.y += 0.004;
  }

  if(started){
    const move = new THREE.Vector3();
    if(keys.KeyW||keys.ArrowUp) move.z -= 1;
    if(keys.KeyS||keys.ArrowDown) move.z += 1;
    if(keys.KeyA||keys.ArrowLeft) move.x -= 1;
    if(keys.KeyD||keys.ArrowRight) move.x += 1;

    if(move.lengthSq()>0){
      move.normalize();
      const fast = (keys.ShiftLeft||keys.ShiftRight) && signal > 2;
      const speed = fast ? .105 : .055;
      if(fast) signal = Math.max(0, signal - .22);
      player.position.add(move.multiplyScalar(speed));
      const targetRot = Math.atan2(move.x, move.z);
      player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRot, .16);
    }else{
      signal = Math.min(100, signal + .04);
    }

    player.position.x = THREE.MathUtils.clamp(player.position.x,-9,9);
    player.position.z = THREE.MathUtils.clamp(player.position.z,-9,9);

    const dx = player.position.x - aoiGroup.position.x;
    const dz = player.position.z - aoiGroup.position.z;
    const d = Math.sqrt(dx*dx + dz*dz);

    if(d < 4.5 && fluxTimer <= 0){
      risk = Math.min(100, risk + .35);
      if(risk > 80) integrity = Math.max(0, integrity - .08);
    }else{
      risk = Math.max(0, risk - .18);
    }
    if(fluxTimer > 0) fluxTimer--;

    const desired = new THREE.Vector3(player.position.x+5.4, 4.7, player.position.z+6.0);
    camera.position.lerp(desired, .045);
    camera.lookAt(player.position.x, 1.0, player.position.z);
    player.position.y = Math.sin(t*3.2)*.018;
  }

  hud();
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
