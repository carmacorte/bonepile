<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>BONEPILE - R3-W0RK 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#030504;color:#c8c8c8;font-family:'Share Tech Mono',monospace;touch-action:none}
#game{position:fixed;inset:0;background:#020303}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top-hud{position:absolute;top:18px;left:18px;display:flex;gap:12px}
.stat{width:150px;background:rgba(5,8,8,.72);border:1px solid rgba(90,138,106,.75);padding:10px 12px}
.stat-label{color:#7fb18d;font-size:12px;letter-spacing:3px;margin-bottom:8px}
.bar{height:8px;background:#151817;overflow:hidden}.fill{height:100%;transition:width .2s}
#integrityFill{width:100%;background:#ff6b35}#signalFill{width:100%;background:#00a8ff}#riskFill{width:0%;background:#ff0033}
.title{position:absolute;top:18px;right:22px;text-align:right;color:#b87333;letter-spacing:3px;font-size:16px;text-shadow:0 0 8px rgba(184,115,51,.5)}
.subtitle{color:#5a8a6a;font-size:11px;margin-top:4px;letter-spacing:1px}
.log{position:absolute;left:18px;bottom:22px;width:min(520px,calc(100vw - 36px));min-height:52px;padding:12px 16px;background:rgba(5,8,8,.78);border-left:3px solid #ff6b35;color:#b8b8b8;font-size:14px;line-height:1.5}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(2,3,3,.88);text-align:center}
.main-title{font-size:70px;letter-spacing:12px;color:#cfcfcf;text-shadow:0 0 18px rgba(255,255,255,.16),0 8px 0 #191919}
.main-sub{margin-top:18px;padding-bottom:12px;border-bottom:1px solid #2a4a3a;color:#7fb18d;letter-spacing:6px;font-size:15px}
.quote{margin:35px 0;max-width:620px;color:#777;font-style:italic;line-height:1.6}
button{font-family:'Share Tech Mono',monospace;background:rgba(5,8,8,.6);color:#ff6b35;border:1px solid #ff6b35;padding:14px 36px;letter-spacing:4px;font-size:15px;cursor:pointer}
#touch{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}
.dpad{position:absolute;left:28px;bottom:28px;width:162px;height:162px;pointer-events:auto}
.touch-btn{position:absolute;width:58px;height:58px;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,107,53,.75);color:#ff6b35;background:rgba(6,8,8,.66);font-size:22px;user-select:none;-webkit-user-select:none}
#up{left:52px;top:0}#left{left:0;top:52px}#right{left:104px;top:52px}#down{left:52px;top:104px}
.actions{position:absolute;right:28px;bottom:34px;width:270px;height:150px;pointer-events:auto}
.action{position:absolute;width:92px;height:60px;border-radius:14px;border:1px solid rgba(90,138,106,.85);color:#7fb18d;background:rgba(6,8,8,.66);display:flex;justify-content:center;align-items:center;letter-spacing:3px;font-size:13px;user-select:none;-webkit-user-select:none}
#dash{right:108px;top:0}#flux{right:0;top:0;color:#00ff41;border-color:#00ff41}#use{right:54px;top:78px;color:#ff6b35;border-color:#ff6b35;width:120px}
.active{background:rgba(255,107,53,.25)!important;box-shadow:0 0 18px rgba(255,107,53,.45)}
.crt:before{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.18) 50%),linear-gradient(90deg,rgba(255,0,0,.025),rgba(0,255,0,.012),rgba(0,0,255,.025));background-size:100% 2px,3px 100%;opacity:.75}
@media (hover:none),(pointer:coarse),(max-width:900px){#touch{display:block}.main-title{font-size:48px;letter-spacing:8px}.top-hud{gap:8px;top:12px;left:12px}.stat{width:116px;padding:8px}.stat-label{font-size:10px;letter-spacing:2px}.title{display:none}.log{font-size:12px;bottom:12px;max-width:45vw}}
</style>
</head>
<body class="crt">
<div id="game"></div>
<div id="hud">
  <div class="top-hud">
    <div class="stat"><div class="stat-label">INTEGRIDAD</div><div class="bar"><div class="fill" id="integrityFill"></div></div></div>
    <div class="stat"><div class="stat-label">SENAL</div><div class="bar"><div class="fill" id="signalFill"></div></div></div>
    <div class="stat"><div class="stat-label">RIESGO AOI</div><div class="bar"><div class="fill" id="riskFill"></div></div></div>
  </div>
  <div class="title">BONEPILE 3D PROTOTYPE<div class="subtitle">R3-W0RK // UNREGISTERED NODE</div></div>
  <div class="log" id="log">&gt; Esperando secuencia de arranque.</div>
</div>
<div id="touch">
  <div class="dpad"><div class="touch-btn" id="up">▲</div><div class="touch-btn" id="left">◀</div><div class="touch-btn" id="right">▶</div><div class="touch-btn" id="down">▼</div></div>
  <div class="actions"><div class="action" id="dash">DASH</div><div class="action" id="flux">FLUX</div><div class="action" id="use">E / USE</div></div>
</div>
<div id="menu">
  <div class="main-title">BONEPILE</div>
  <div class="main-sub">// R3-W0RK GLB INTEGRATION //</div>
  <div class="quote">No necesitamos ser perfectos. Solo necesitamos seguir funcionando.<br>- R3-W0RK</div>
  <button id="startBtn">INICIAR 3D</button>
</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const container=document.getElementById('game'),logBox=document.getElementById('log'),menu=document.getElementById('menu');
const keys={};let started=false,integrity=100,signal=100,risk=0,fluxTimer=0;
function log(m){logBox.innerHTML='&gt; '+m}

const scene=new THREE.Scene();scene.background=new THREE.Color(0x020404);scene.fog=new THREE.FogExp2(0x020404,.045);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(7,7,8);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9fb3a2,0x101010,1.25));
const keyLight=new THREE.DirectionalLight(0xffffff,2.1);keyLight.position.set(5,10,5);keyLight.castShadow=true;keyLight.shadow.mapSize.set(2048,2048);scene.add(keyLight);
const copperLight=new THREE.PointLight(0xff6b35,2.8,12);copperLight.position.set(-3,1.5,2);scene.add(copperLight);
const greenLight=new THREE.PointLight(0x00ff66,1.4,10);greenLight.position.set(3,1.2,-2);scene.add(greenLight);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0x07110d,roughness:.72,metalness:.18}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(24,24,0x1a3c2b,0x0e1f17);grid.position.y=.01;scene.add(grid);
function trace(x,z,sx,sz){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,.035,sz),new THREE.MeshStandardMaterial({color:0xb87333,emissive:0x5a2508,emissiveIntensity:.9,roughness:.35,metalness:.75}));m.position.set(x,.04,z);m.receiveShadow=true;scene.add(m)}
trace(0,0,18,.12);trace(-4,2.8,.12,8);trace(4.2,-2.2,.12,7);trace(2.2,3.5,7,.1);trace(-3.4,-3.6,6,.1);
function chip(x,z,sx,sz){const b=new THREE.Mesh(new THREE.BoxGeometry(sx,.28,sz),new THREE.MeshStandardMaterial({color:0x1b1b1b,roughness:.85,metalness:.25}));b.position.set(x,.16,z);b.castShadow=true;b.receiveShadow=true;scene.add(b)}
chip(-5,-2.5,1.4,.9);chip(5.2,2.4,1.8,1.1);chip(0,4.4,2.2,.8);

const aoiGroup=new THREE.Group();
const aoiBody=new THREE.Mesh(new THREE.BoxGeometry(1.1,.45,.8),new THREE.MeshStandardMaterial({color:0x444444,roughness:.45,metalness:.65}));aoiBody.castShadow=true;aoiGroup.add(aoiBody);
const lens=new THREE.Mesh(new THREE.SphereGeometry(.16,24,16),new THREE.MeshStandardMaterial({color:0xff0033,emissive:0xff0033,emissiveIntensity:2.2}));lens.position.set(0,-.03,-.42);aoiGroup.add(lens);
const aoiLight=new THREE.SpotLight(0xff0033,3.8,8,Math.PI/7,.45,1.2);aoiLight.position.set(0,-.1,-.45);aoiLight.target.position.set(0,-1,-4);aoiGroup.add(aoiLight);aoiGroup.add(aoiLight.target);aoiGroup.position.set(3,2.2,-3);scene.add(aoiGroup);

let player=new THREE.Group();scene.add(player);
const loader=new GLTFLoader();
loader.load('./R3WORK.glb',gltf=>{
  const model=gltf.scene;
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);
  const scale=1.55/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);model.position.sub(center.multiplyScalar(scale));model.rotation.y=Math.PI;
  player.add(model);player.position.set(-6,.08,0);log('R3-W0RK cargado desde GLB. Modelo activo.');
},undefined,err=>{console.error(err);log('ERROR: No se pudo cargar ./R3WORK.glb. Verifica nombre y ubicacion.')});

addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
function bindTouch(id,code,tapFn=null){const el=document.getElementById(id);const down=e=>{e.preventDefault();el.classList.add('active');keys[code]=true;if(tapFn)tapFn()};const up=e=>{e.preventDefault();el.classList.remove('active');keys[code]=false};el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);el.addEventListener('mouseleave',up)}
bindTouch('up','KeyW');bindTouch('left','KeyA');bindTouch('right','KeyD');bindTouch('down','KeyS');bindTouch('dash','ShiftLeft');bindTouch('flux','Space',()=>useFlux());bindTouch('use','KeyE',()=>log('Rework interaction pending. Banco no conectado en v2.0.'));
document.getElementById('startBtn').addEventListener('click',()=>{started=true;menu.style.display='none';log('Secuencia 3D iniciada. R3-W0RK operativo.')});
function useFlux(){if(!started)return;fluxTimer=180;risk=Math.max(0,risk-45);log('Flux cloud deployed. AOI optical confidence degraded.')}
function hud(){document.getElementById('integrityFill').style.width=integrity+'%';document.getElementById('signalFill').style.width=signal+'%';document.getElementById('riskFill').style.width=risk+'%'}

function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;
 aoiGroup.position.x=3+Math.sin(t*.8)*2.4;aoiGroup.rotation.y=Math.sin(t*.8)*.6;copperLight.intensity=2.3+Math.sin(t*3)*.4;
 if(started){const move=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)move.z-=1;if(keys.KeyS||keys.ArrowDown)move.z+=1;if(keys.KeyA||keys.ArrowLeft)move.x-=1;if(keys.KeyD||keys.ArrowRight)move.x+=1;
  if(move.lengthSq()>0){move.normalize();const speed=(keys.ShiftLeft||keys.ShiftRight)&&signal>2?.105:.055;if((keys.ShiftLeft||keys.ShiftRight)&&signal>2)signal=Math.max(0,signal-.22);player.position.add(move.multiplyScalar(speed));const targetRot=Math.atan2(move.x,move.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,targetRot,.16)}else signal=Math.min(100,signal+.04);
  player.position.x=THREE.MathUtils.clamp(player.position.x,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z,-9,9);
  const dx=player.position.x-aoiGroup.position.x,dz=player.position.z-aoiGroup.position.z,d=Math.sqrt(dx*dx+dz*dz);if(d<4.5&&fluxTimer<=0){risk=Math.min(100,risk+.35);if(risk>80)integrity=Math.max(0,integrity-.08)}else risk=Math.max(0,risk-.18);if(fluxTimer>0)fluxTimer--;
  const desired=new THREE.Vector3(player.position.x+6.5,6.4,player.position.z+7.2);camera.position.lerp(desired,.045);camera.lookAt(player.position.x,.5,player.position.z);player.position.y=.08+Math.sin(t*3.2)*.018}
 hud();renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
