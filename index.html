<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>BONEPILE - R3-W0RK 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#030504;color:#c8c8c8;font-family:'Share Tech Mono',monospace;touch-action:none}
#game{position:fixed;inset:0;background:#020303}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top-hud{position:absolute;top:18px;left:18px;display:flex;gap:12px}
.stat{width:150px;background:rgba(5,8,8,.72);border:1px solid rgba(90,138,106,.75);padding:10px 12px}
.stat-label{color:#7fb18d;font-size:12px;letter-spacing:3px;margin-bottom:8px}
.bar{height:8px;background:#151817;overflow:hidden}.fill{height:100%;transition:width .2s}
#integrityFill{width:100%;background:#ff6b35}#signalFill{width:100%;background:#00a8ff}#riskFill{width:0%;background:#ff0033}
.title{position:absolute;top:18px;right:22px;text-align:right;color:#b87333;letter-spacing:3px;font-size:16px;text-shadow:0 0 8px rgba(184,115,51,.5)}
.subtitle{color:#5a8a6a;font-size:11px;margin-top:4px;letter-spacing:1px}
.log{position:absolute;left:18px;bottom:22px;width:min(520px,calc(100vw - 36px));min-height:52px;padding:12px 16px;background:rgba(5,8,8,.78);border-left:3px solid #ff6b35;color:#b8b8b8;font-size:14px;line-height:1.5}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(2,3,3,.88);text-align:center}
.main-title{font-size:70px;letter-spacing:12px;color:#cfcfcf;text-shadow:0 0 18px rgba(255,255,255,.16),0 8px 0 #191919}
.main-sub{margin-top:18px;padding-bottom:12px;border-bottom:1px solid #2a4a3a;color:#7fb18d;letter-spacing:6px;font-size:15px}
.quote{margin:35px 0;max-width:620px;color:#777;font-style:italic;line-height:1.6}
button{font-family:'Share Tech Mono',monospace;background:rgba(5,8,8,.6);color:#ff6b35;border:1px solid #ff6b35;padding:14px 36px;letter-spacing:4px;font-size:15px;cursor:pointer}
#touch{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}
.dpad{position:absolute;left:28px;bottom:28px;width:162px;height:162px;pointer-events:auto}
.touch-btn{position:absolute;width:58px;height:58px;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,107,53,.75);color:#ff6b35;background:rgba(6,8,8,.66);font-size:22px;user-select:none}
#up{left:52px;top:0}#left{left:0;top:52px}#right{left:104px;top:52px}#down{left:52px;top:104px}
.actions{position:absolute;right:28px;bottom:34px;width:270px;height:150px;pointer-events:auto}
.action{position:absolute;width:92px;height:60px;border-radius:14px;border:1px solid rgba(90,138,106,.85);color:#7fb18d;background:rgba(6,8,8,.66);display:flex;justify-content:center;align-items:center;letter-spacing:3px;font-size:13px;user-select:none}
#dash{right:108px;top:0}#flux{right:0;top:0;color:#00ff41;border-color:#00ff41}#use{right:54px;top:78px;color:#ff6b35;border-color:#ff6b35;width:120px}
.active{background:rgba(255,107,53,.25)!important;box-shadow:0 0 18px rgba(255,107,53,.45)}
.crt:before{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.18) 50%),linear-gradient(90deg,rgba(255,0,0,.025),rgba(0,255,0,.012),rgba(0,0,255,.025));background-size:100% 2px,3px 100%;opacity:.75}
@media (hover:none),(pointer:coarse),(max-width:900px){#touch{display:block}.main-title{font-size:48px;letter-spacing:8px}.top-hud{gap:8px;top:12px;left:12px}.stat{width:116px;padding:8px}.stat-label{font-size:10px;letter-spacing:2px}.title{display:none}.log{font-size:12px;bottom:12px;max-width:45vw}}
</style>
</head>
<body class="crt">
<div id="game"></div>
<div id="hud">
  <div class="top-hud">
    <div class="stat"><div class="stat-label">INTEGRIDAD</div><div class="bar"><div class="fill" id="integrityFill"></div></div></div>
    <div class="stat"><div class="stat-label">SENAL</div><div class="bar"><div class="fill" id="signalFill"></div></div></div>
    <div class="stat"><div class="stat-label">RIESGO AOI</div><div class="bar"><div class="fill" id="riskFill"></div></div></div>
  </div>
  <div class="title">BONEPILE 3D<div class="subtitle">R3-W0RK // UNREGISTERED NODE</div></div>
  <div class="log" id="log">&gt; Sistema de animación cargado. R3-W0RK despertando...</div>
</div>
<div id="touch">
  <div class="dpad"><div class="touch-btn" id="up">▲</div><div class="touch-btn" id="left">◀</div><div class="touch-btn" id="right">▶</div><div class="touch-btn" id="down">▼</div></div>
  <div class="actions"><div class="action" id="dash">DASH</div><div class="action" id="flux">FLUX</div><div class="action" id="use">E / USE</div></div>
</div>
<div id="menu">
  <div class="main-title">BONEPILE</div>
  <div class="main-sub">// R3-W0RK AWAKENING //</div>
  <div class="quote">No necesitamos ser perfectos.<br>Solo necesitamos seguir funcionando.</div>
  <button id="startBtn">INICIAR 3D</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const container = document.getElementById('game');
const logBox = document.getElementById('log');
const menu = document.getElementById('menu');

let started = false;
let integrity = 100, signal = 100, risk = 0, flux = 80;
let player, model, mixer, actions = {};
let currentState = 'idle';
let velocity = new THREE.Vector3();
let isJumping = false;
let jumpVelocity = 0;

const keys = {};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020404);
scene.fog = new THREE.FogExp2(0x020404, 0.045);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 120);
camera.position.set(8, 9, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Luces
scene.add(new THREE.HemisphereLight(0x9fb3a2, 0x101010, 1.3));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(5, 12, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const copperLight = new THREE.PointLight(0xff6b35, 2.8, 15);
copperLight.position.set(-3, 2, 3);
scene.add(copperLight);

// Suelo y decoración
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({color: 0x07110d, roughness: 0.75, metalness: 0.2})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(30, 30, 0x1a3c2b, 0x0e1f17);
grid.position.y = 0.01;
scene.add(grid);

// === PLAYER ===
player = new THREE.Group();
scene.add(player);

const loader = new GLTFLoader();
loader.load('./R3WORK.glb', (gltf) => {
    model = gltf.scene;
    model.traverse(o => {
        if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
        }
    });

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scale = 1.6 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(scale);
    model.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(scale));
    model.rotation.y = Math.PI;

    player.add(model);
    player.position.set(-6, 0.1, 0);

    // Animaciones
    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        actions[clip.name.toLowerCase()] = action;
    });

    log('✅ R3-W0RK cobró vida. Animaciones cargadas.');
}, undefined, err => {
    console.error(err);
    log('ERROR: No se pudo cargar R3WORK.glb');
});

// Controles
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

function log(m) { logBox.innerHTML = '&gt; ' + m; }

// Touch controls (mantengo los existentes)
function bindTouch(id, code, tapFn = null) {
    const el = document.getElementById(id);
    const down = e => { e.preventDefault(); el.classList.add('active'); keys[code] = true; if(tapFn) tapFn(); };
    const up = e => { e.preventDefault(); el.classList.remove('active'); keys[code] = false; };
    ['touchstart','mousedown'].forEach(ev => el.addEventListener(ev, down));
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, up));
}
bindTouch('up','KeyW'); bindTouch('left','KeyA'); bindTouch('right','KeyD'); bindTouch('down','KeyS');
bindTouch('dash','ShiftLeft');
bindTouch('flux','Space', () => { if(started) useFlux(); });
bindTouch('use','KeyE', () => log('Interacción pendiente...'));

document.getElementById('startBtn').addEventListener('click', () => {
    started = true;
    menu.style.display = 'none';
    log('Secuencia de arranque completada. R3-W0RK operativo.');
});

function useFlux() {
    if (!started || flux < 25) return;
    flux -= 25;
    log('FLUX deployed - AOI confundido temporalmente');
}

// HUD
function updateHUD() {
    document.getElementById('integrityFill').style.width = integrity + '%';
    document.getElementById('signalFill').style.width = signal + '%';
    document.getElementById('riskFill').style.width = risk + '%';
}

function updateAnimation(delta) {
    if (!mixer || !model) return;
    mixer.update(delta);
}

function applyProcedural(t) {
    if (!model) return;
    // Bobbing + breathing
    model.position.y = 0.1 + Math.sin(t * 4) * 0.022;
    const breath = 1 + Math.sin(t * 3) * 0.015;
    model.scale.setScalar(1.6 * breath); // sutil efecto de "vida"
}

let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;
    const t = now * 0.001;

    if (started && model) {
        const move = new THREE.Vector3();
        if (keys.KeyW || keys.ArrowUp) move.z -= 1;
        if (keys.KeyS || keys.ArrowDown) move.z += 1;
        if (keys.KeyA || keys.ArrowLeft) move.x -= 1;
        if (keys.KeyD || keys.ArrowRight) move.x += 1;

        const isMoving = move.lengthSq() > 0;
        const isDashing = (keys.ShiftLeft || keys.ShiftRight) && isMoving;

        if (isMoving) {
            move.normalize();
            const speed = isDashing ? 0.14 : 0.07;
            player.position.add(move.multiplyScalar(speed));

            const targetRot = Math.atan2(move.x, move.z);
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRot, 0.18);
        }

        // Salto
        if ((keys.Space) && !isJumping) {
            isJumping = true;
            jumpVelocity = 0.18;
            log('Jump!');
        }
        if (isJumping) {
            player.position.y += jumpVelocity;
            jumpVelocity -= 0.012; // gravedad
            if (player.position.y <= 0.1) {
                player.position.y = 0.1;
                isJumping = false;
                jumpVelocity = 0;
            }
        }

        // Clamp
        player.position.x = THREE.MathUtils.clamp(player.position.x, -12, 12);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -12, 12);

        updateAnimation(delta);
        applyProcedural(t);
    }

    updateHUD();
    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
