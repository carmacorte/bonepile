<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BONEPILE 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#020202;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#c8c8c8;}
#gameCanvas{display:block;width:100vw;height:100dvh;}
#ui-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none;}
.hud-top{position:absolute;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;}
.hud-right{position:absolute;top:10px;right:10px;text-align:right;background:rgba(4,4,6,0.85);border:1px solid #2a5a3a;padding:5px 10px;}
.stat-box{background:rgba(4,4,6,0.9);border:1px solid #2a5a3a;padding:4px 8px;font-size:9px;min-width:80px;}
.stat-label{color:#5aaa6a;font-size:7px;text-transform:uppercase;letter-spacing:1px;}
.stat-bar{width:100%;height:4px;background:#0f0f14;margin-top:2px;overflow:hidden;border:1px solid #1a1a1a;}
.stat-fill{height:100%;transition:width 0.3s;}
.zone-title{color:#c8a050;font-size:11px;letter-spacing:2px;}
.zone-sub{color:#4a8a5a;font-size:7px;}
.hud-bottom{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;}
.log{background:rgba(4,4,6,0.95);border-left:2px solid #ff6b35;padding:5px 8px;max-width:60vw;font-size:9px;color:#aaa;}
#touch-controls{position:fixed;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20;display:none;}
.touch-btn{position:absolute;pointer-events:auto;background:rgba(10,12,10,0.8);border:1.5px solid #3a5a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6aaa7a;font-size:12px;touch-action:none;}
.touch-btn:active{background:rgba(255,107,53,0.2);border-color:#ff6b35;color:#ff6b35;}
#stick-zone{width:100px;height:100px;left:15px;bottom:calc(15px + env(safe-area-inset-bottom));border-radius:50%;border:1.5px solid #2a4a2a;background:rgba(10,12,10,0.4);}
#stick-knob{width:48px;height:48px;left:41px;bottom:calc(41px + env(safe-area-inset-bottom));border-radius:50%;border:2px solid #4a8a5a;background:rgba(20,40,20,0.7);pointer-events:none;}
#btn-dash{right:15px;bottom:calc(15px + env(safe-area-inset-bottom));width:56px;height:56px;font-size:10px;border-radius:10px;border-color:#ff6b35;color:#ff6b35;}
#btn-flux{right:80px;bottom:calc(15px + env(safe-area-inset-bottom));width:48px;height:48px;font-size:9px;}
#btn-interact{right:15px;bottom:calc(78px + env(safe-area-inset-bottom));width:48px;height:48px;font-size:9px;}
#menu-screen{position:fixed;inset:0;background:rgba(2,2,2,0.98);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:50;pointer-events:auto;}
.title-big{font-size:clamp(28px,7vw,48px);color:#c0c0c0;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px rgba(255,255,255,0.1);margin-bottom:6px;}
.subtitle{color:#5a9a6a;font-size:clamp(9px,2.5vw,12px);letter-spacing:3px;margin-bottom:24px;border-bottom:1px solid #2a5a3a;padding-bottom:6px;}
.menu-btn{background:transparent;border:1.5px solid #ff6b35;color:#ff6b35;font-family:inherit;font-size:clamp(10px,3vw,13px);padding:12px 28px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;margin:4px;min-width:200px;}
.menu-btn:active{background:rgba(255,107,53,0.2);}
.quote{font-style:italic;color:#5a5a5a;font-size:clamp(9px,2.5vw,11px);max-width:340px;text-align:center;margin:12px 0;line-height:1.5;}
.hidden{display:none !important;visibility:hidden !important;opacity:0 !important;}
#loading{position:fixed;inset:0;background:#020202;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;}
.loading-text{font-size:16px;color:#0f0;letter-spacing:3px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.loading-bar{width:180px;height:3px;background:#1a1a1a;border:1px solid #0f0;margin-top:12px;overflow:hidden;}
.loading-fill{height:100%;background:#0f0;width:0%;transition:width 0.2s;}
body.touch-active #touch-controls{display:block;}
#error-screen{position:fixed;inset:0;background:#020202;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:200;color:#f60;padding:20px;text-align:center;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="loading">
  <div class="loading-text">INICIALIZANDO R3-W0RK...</div>
  <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
  <div style="font-size:9px;color:#3a5a3a;margin-top:8px;">CARGANDO PROTOCOLO DE SUPERVIVENCIA</div>
  <button id="btn-skip" style="margin-top:20px;background:transparent;border:1px solid #3a5a3a;color:#5a9a6a;font-family:inherit;font-size:10px;padding:8px 16px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;display:none;">OMITIR CARGA ▶</button>
  <div id="loading-status" style="font-size:8px;color:#f60;margin-top:8px;opacity:0;transition:opacity 0.5s;"></div>
</div>
<div id="error-screen">
  <div style="font-size:18px;color:#f60;margin-bottom:10px;">ERROR DE SISTEMA</div>
  <div id="error-msg" style="font-size:11px;color:#888;max-width:300px;line-height:1.6;"></div>
  <button class="menu-btn" style="margin-top:20px;" onclick="location.reload()">REINTENTAR</button>
</div>
<div id="ui-layer">
  <div class="hud-top">
    <div class="stat-box"><div class="stat-label">INTEGRIDAD</div><div class="stat-bar"><div class="stat-fill" id="barIntegrity" style="width:100%;background:#ff6b35"></div></div></div>
    <div class="stat-box"><div class="stat-label">SEÑAL</div><div class="stat-bar"><div class="stat-fill" id="barSignal" style="width:100%;background:#00a8ff"></div></div></div>
    <div class="stat-box"><div class="stat-label">RIESGO</div><div class="stat-bar"><div class="stat-fill" id="barRisk" style="width:0%;background:#ff0033"></div></div></div>
    <div class="stat-box"><div class="stat-label">SCRAP</div><div style="font-size:12px;color:#c8a050;" id="scrapCount">0</div></div>
  </div>
  <div class="hud-right">
    <div class="zone-title">MRB VAULT</div>
    <div class="zone-sub">SECTOR 7B</div>
  </div>
  <div class="hud-bottom">
    <div class="log" id="gameLog">&gt; Secuencia iniciada...</div>
  </div>
</div>
<div id="touch-controls">
  <div class="touch-btn" id="stick-zone"></div>
  <div class="touch-btn" id="stick-knob"></div>
  <div class="touch-btn" id="btn-dash">DASH</div>
  <div class="touch-btn" id="btn-flux">FLUX</div>
  <div class="touch-btn" id="btn-interact">USE</div>
</div>
<div id="menu-screen" class="hidden">
  <div class="title-big">BONEPILE</div>
  <div class="subtitle">// PROTOCOLO v3.0 //</div>
  <div class="quote">"No necesitamos ser perfectos. Solo seguir funcionando."<br>— R3-W0RK</div>
  <button class="menu-btn" id="btn-start">INICIAR SECUENCIA</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= ERROR HANDLING ================= */
window.onerror=function(msg,url,line){
  document.getElementById('loading').style.display='none';
  document.getElementById('error-screen').style.display='flex';
  document.getElementById('error-msg').textContent='Line '+line+': '+msg;
  return true;
};

/* ================= TOUCH DETECTION ================= */
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(isTouch) document.body.classList.add('touch-active');

/* ================= AUDIO ================= */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx){audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();}}
function beep(freq,dur,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=freq||880;o.type='square';
  g.gain.setValueAtTime(vol||0.05,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.1));
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(dur||0.1));
}

/* ================= THREE.JS SETUP ================= */
const canvas=document.getElementById('gameCanvas');
let renderer,scene,camera;
let gameState='loading';
let frame=0;
const keys={};
let player,npcs=[],enemies=[],items=[],stations=[];

function initThree(){
  try{
    // Check WebGL support
    const gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
    if(!gl) throw new Error('WebGL no soportado en este dispositivo');

    renderer=new THREE.WebGLRenderer({canvas,antialias:false});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
    renderer.setClearColor(0x101018);

    scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0x080810,0.025);

    camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,100);
    camera.position.set(0,3,5);

    // Lights - simple for mobile compatibility
    const hemi=new THREE.HemisphereLight(0x88aadd,0x1a3a1a,0.8);
    scene.add(hemi);
    const dir=new THREE.DirectionalLight(0xfff8ee,1.2);
    dir.position.set(15,25,15);
    scene.add(dir);
    const amb=new THREE.AmbientLight(0x404060,0.6);
    scene.add(amb);
    // Fill light from below (bounce)
    const fill=new THREE.DirectionalLight(0x6688aa,0.4);
    fill.position.set(-10,5,-10);
    scene.add(fill);

    // Ground - simple colored plane, NO texture
    const groundGeo=new THREE.PlaneGeometry(60,60);
    const groundMat=new THREE.MeshPhongMaterial({color:0x1a2e1a,shininess:10});
    const ground=new THREE.Mesh(groundGeo,groundMat);
    ground.rotation.x=-Math.PI/2;
    scene.add(ground);

    // Grid
    const grid=new THREE.GridHelper(60,60,0x3a6a4a,0x1a2a1a);
    grid.position.y=0.01;
    scene.add(grid);

    // Create player
    createPlayer();

    // Create world
    createWorld();

    // Create NPCs
    createAllNPCs();

    // Create items
    createItems();

    // Create enemies
    createEnemies();

    // Create stations
    createStations();

    return true;
  }catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('error-screen').style.display='flex';
    document.getElementById('error-msg').textContent=e.message;
    return false;
  }
}

/* ================= PLAYER ================= */
function createPlayer(){
  player={
    x:0,z:0,vx:0,vz:0,
    speed:4,dashSpeed:8,
    integrity:100,signal:100,risk:0,scrap:0,
    dashing:false,hidden:false,
    dashCooldown:0,dir:{x:0,z:1},
    walkTime:0
  };

  const group=new THREE.Group();
  // Body
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(0.4,0.3,0.25),
    new THREE.MeshPhongMaterial({color:0x5a5a5a,shininess:50})
  );
  body.position.y=0.35;
  group.add(body);
  // Eye
  const eye=new THREE.Mesh(
    new THREE.SphereGeometry(0.06,8,8),
    new THREE.MeshPhongMaterial({color:0xff0033,emissive:0xff0033,emissiveIntensity:3,shininess:100})
  );
  eye.position.set(0.15,0.38,0.1);
  group.add(eye);
  // Eye light
  const eyeLight=new THREE.PointLight(0xff0033,0.5,2);
  eyeLight.position.set(0.15,0.38,0.1);
  group.add(eyeLight);
  // Legs
  for(let s=-1;s<=1;s+=2){
    for(let i=0;i<4;i++){
      const leg=new THREE.Mesh(
        new THREE.BoxGeometry(0.03,0.2,0.02),
        new THREE.MeshPhongMaterial({color:0xb87333,shininess:50})
      );
      leg.position.set(s*0.2,0.1,0.06-i*0.05);
      group.add(leg);
    }
  }
  // Cape
  const cape=new THREE.Mesh(
    new THREE.PlaneGeometry(0.4,0.3),
    new THREE.MeshPhongMaterial({color:0x4a4a4a,side:THREE.DoubleSide,transparent:true,opacity:0.8})
  );
  cape.position.set(0,0.35,-0.18);
  cape.rotation.x=0.1;
  group.add(cape);
  // Tool
  const tool=new THREE.Mesh(
    new THREE.CylinderGeometry(0.01,0.01,0.2,4),
    new THREE.MeshPhongMaterial({color:0x888,shininess:80})
  );
  tool.rotation.z=0.5;
  tool.position.set(0.3,0.3,0.1);
  group.add(tool);
  const tip=new THREE.Mesh(
    new THREE.SphereGeometry(0.02,6,6),
    new THREE.MeshPhongMaterial({color:0xff6b35,emissive:0xff6b35,emissiveIntensity:1})
  );
  tip.position.set(0.35,0.38,0.1);
  group.add(tip);
  // LED
  const led=new THREE.Mesh(
    new THREE.SphereGeometry(0.02,6,6),
    new THREE.MeshPhongMaterial({color:0x00ff41,emissive:0x00ff41,emissiveIntensity:1})
  );
  led.position.set(-0.1,0.42,0.08);
  group.add(led);

  group.position.set(0,0,0);
  scene.add(group);
  player.mesh=group;
  player.cape=cape;
}

/* ================= WORLD ================= */
function createWorld(){
  // Buildings
  const buildings=[
    [-8,-8,3,4,2,0x3a3a3a],[-6,10,2,3,2,0x2a2a3a],[12,-5,4,2,3,0x2a3a2a],
    [15,8,2,5,2,0x3a2a2a],[-15,-2,3,3,3,0x3a3a3a],[8,-12,2,2,2,0x2a3a3a],
    [-5,15,3,2,3,0x3a3a2a],[10,12,2,4,2,0x2a2a3a],[-12,5,2,2,2,0x3a2a2a],
    [5,5,2,2,2,0x2a3a2a],[-8,-15,4,4,4,0x3a3a3a],[18,0,2,3,2,0x3a2a2a],
    [-18,8,3,5,3,0x2a3a2a],[0,18,2,2,2,0x2a2a3a],[12,0,2,2,2,0x3a3a3a],
  ];
  for(let b of buildings){
    const mesh=new THREE.Mesh(
      new THREE.BoxGeometry(b[2],b[3],b[4]),
      new THREE.MeshPhongMaterial({color:b[5],shininess:20})
    );
    mesh.position.set(b[0],b[3]/2,b[1]);
    scene.add(mesh);
    // Top highlight
    const top=new THREE.Mesh(
      new THREE.BoxGeometry(b[2]*0.9,0.05,b[4]*0.9),
      new THREE.MeshPhongMaterial({color:0x2a2a2a,shininess:40})
    );
    top.position.set(b[0],b[3]+0.025,b[1]);
    scene.add(top);
  }
  // Traces (copper roads)
  const traces=[
    [-20,0,20,0],[0,-20,0,20],[-15,-15,15,15],[-15,15,15,-15],
    [-20,8,20,8],[-20,-8,20,-8],[8,-20,8,20],[-8,-20,-8,20],
  ];
  for(let t of traces){
    const len=Math.sqrt((t[2]-t[0])**2+(t[3]-t[1])**2);
    const mesh=new THREE.Mesh(
      new THREE.BoxGeometry(0.6,0.05,len),
      new THREE.MeshPhongMaterial({color:0xd4a050,emissive:0xc89040,emissiveIntensity:0.6,shininess:80})
    );
    mesh.position.set((t[0]+t[2])/2,0.03,(t[1]+t[3])/2);
    mesh.lookAt(t[2],0.03,t[3]);
    scene.add(mesh);
  }
  // Small components scattered
  for(let i=0;i<30;i++){
    const type=Math.floor(Math.random()*3);
    const colors=[0x8b4513,0x2a1a1a,0xff0000];
    const mesh=new THREE.Mesh(
      new THREE.BoxGeometry(0.2,0.15,0.4),
      new THREE.MeshPhongMaterial({color:colors[type],shininess:30})
    );
    mesh.position.set((Math.random()-0.5)*50,0.075,(Math.random()-0.5)*50);
    scene.add(mesh);
  }
}

/* ================= NPCs ================= */
function createNPC(x,z,type,name,damaged,dialogues){
  const group=new THREE.Group();
  let bodyColor=0x3a3a3a;
  let eyeColor=0x00a8ff;
  let height=0.6;

  if(type==='cap'){
    bodyColor=0x2a2a3a;eyeColor=0x00a8ff;height=0.9;
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.7,10),new THREE.MeshPhongMaterial({color:bodyColor,shininess:30}));
    body.position.y=0.35;group.add(body);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.3,0.06,10),new THREE.MeshPhongMaterial({color:0x2a2a3a}));
    cap.position.y=0.73;group.add(cap);
  }else if(type==='bga'){
    bodyColor=0x3a3a3a;eyeColor=0x00ff41;height=0.4;
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.3,0.7),new THREE.MeshPhongMaterial({color:bodyColor,shininess:30}));
    body.position.y=0.15;group.add(body);
    for(let i=0;i<9;i++){
      const b=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshPhongMaterial({color:0x888,shininess:80}));
      b.position.set((i%3)*0.15-0.15,0.32,Math.floor(i/3)*0.15-0.15);
      group.add(b);
    }
  }else if(type==='resistor'){
    bodyColor=0x8b4513;eyeColor=0xffaa00;height=0.3;
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.15,0.5),new THREE.MeshPhongMaterial({color:bodyColor,shininess:20}));
    body.position.y=0.075;group.add(body);
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.4,4),new THREE.MeshPhongMaterial({color:0xaaa}));
    ant.position.set(0,0.4,0);group.add(ant);
    const antTip=new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6),new THREE.MeshPhongMaterial({color:eyeColor,emissive:eyeColor,emissiveIntensity:1}));
    antTip.position.set(0,0.6,0);group.add(antTip);
  }else if(type==='mosfet'){
    bodyColor=0x3a3a3a;eyeColor=0xff0033;height=0.6;
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,0.8),new THREE.MeshPhongMaterial({color:bodyColor,shininess:30}));
    body.position.y=0.25;group.add(body);
    const shield=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.5,0.3),new THREE.MeshPhongMaterial({color:0x444,shininess:50}));
    shield.position.set(-0.35,0.25,0.2);group.add(shield);
    const spear=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.01,0.6,4),new THREE.MeshPhongMaterial({color:0x888,shininess:80}));
    spear.rotation.z=0.3;spear.position.set(0.4,0.4,0);group.add(spear);
    const spark=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshPhongMaterial({color:0x00a8ff,emissive:0x00a8ff,emissiveIntensity:2}));
    spark.position.set(0.45,0.7,0);group.add(spark);
  }else if(type==='diode'){
    bodyColor=0x2a2a2a;eyeColor=0xffaa00;height=0.6;
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.4,8),new THREE.MeshPhongMaterial({color:bodyColor,shininess:30}));
    body.position.y=0.2;group.add(body);
    const band=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,0.06,8),new THREE.MeshPhongMaterial({color:0xc0c0c0,shininess:80}));
    band.position.y=0.2;group.add(band);
    const lantern=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),new THREE.MeshPhongMaterial({color:0xffaa00,emissive:0xffaa00,emissiveIntensity:2}));
    lantern.position.set(0.2,0.35,0.1);group.add(lantern);
    const lanternLight=new THREE.PointLight(0xffaa00,0.4,3);
    lanternLight.position.set(0.2,0.35,0.1);group.add(lanternLight);
  }else if(type==='inductor'){
    bodyColor=0xa06030;eyeColor=0xff6b35;height=0.5;
    const coil=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.06,6,12),new THREE.MeshPhongMaterial({color:bodyColor,shininess:30}));
    coil.rotation.x=Math.PI/2;coil.position.y=0.35;group.add(coil);
    const core=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.4,6),new THREE.MeshPhongMaterial({color:0x2a1a0a}));
    core.position.y=0.35;group.add(core);
    const staff=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.6,4),new THREE.MeshPhongMaterial({color:0x5a4a3a}));
    staff.position.set(0.3,0.4,0);group.add(staff);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshPhongMaterial({color:eyeColor,emissive:eyeColor,emissiveIntensity:1}));
    tip.position.set(0.3,0.7,0);group.add(tip);
  }else if(type==='crystal'){
    bodyColor=0xaaa;eyeColor=0x00a8ff;height=0.5;
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.4,6),new THREE.MeshPhongMaterial({color:bodyColor,shininess:80}));
    body.position.y=0.2;group.add(body);
    const top=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6,0,Math.PI*2,0,Math.PI/2),new THREE.MeshPhongMaterial({color:0xaaa,shininess:80}));
    top.position.y=0.4;group.add(top);
    const dish=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6,0,Math.PI*2,0,Math.PI/2),new THREE.MeshPhongMaterial({color:0xaaa,shininess:80,side:THREE.DoubleSide}));
    dish.rotation.x=-0.5;dish.position.set(0.15,0.4,0);group.add(dish);
    for(let i=0;i<3;i++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.08+i*0.05,0.008,4,12),new THREE.MeshBasicMaterial({color:0x00a8ff,transparent:true,opacity:0.3}));
      ring.position.set(0.25+i*0.03,0.4,0);ring.rotation.y=Math.PI/2;group.add(ring);
    }
  }

  // Eyes
  for(let s=-1;s<=1;s+=2){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshPhongMaterial({color:eyeColor,emissive:eyeColor,emissiveIntensity:damaged?0.2:1}));
    eye.position.set(s*0.08,height,0.2);
    group.add(eye);
  }

  group.position.set(x,0,z);
  scene.add(group);

  return{
    mesh:group,name:name,damaged:damaged,health:damaged?30:100,
    maxHealth:100,dialogues:dialogues||[],repaired:false,
    repairProgress:0,repairing:false,type:type
  };
}

/* ================= ITEMS ================= */
function createItems(){
  const itemData=[
    {x:3,z:3,color:0xc8a050,type:'scrap'},
    {x:-3,z:7,color:0x00ff41,type:'flux'},
    {x:7,z:-3,color:0x00a8ff,type:'jumper'},
    {x:-7,z:-7,color:0xc8a050,type:'scrap'},
  ];
  for(let d of itemData){
    const group=new THREE.Group();
    const mesh=new THREE.Mesh(
      new THREE.OctahedronGeometry(0.15,0),
      new THREE.MeshPhongMaterial({color:d.color,emissive:d.color,emissiveIntensity:0.8,shininess:50})
    );
    mesh.position.y=0.4;
    group.add(mesh);
    const glow=new THREE.PointLight(d.color,0.5,3);
    glow.position.y=0.4;
    group.add(glow);
    group.position.set(d.x,0,d.z);
    scene.add(group);
    items.push({x:d.x,z:d.z,type:d.type,mesh:mesh,group:group,taken:false});
  }
}

/* ================= ENEMIES ================= */
function createEnemies(){
  for(let i=0;i<3;i++){
    const group=new THREE.Group();
    const body=new THREE.Mesh(
      new THREE.BoxGeometry(0.5,0.3,0.4),
      new THREE.MeshPhongMaterial({color:0x3a3a3a,shininess:40})
    );
    body.position.y=0.5;group.add(body);
    const dome=new THREE.Mesh(
      new THREE.SphereGeometry(0.2,8,8,0,Math.PI*2,0,Math.PI/2),
      new THREE.MeshPhongMaterial({color:0x4a4a4a,shininess:30})
    );
    dome.position.y=0.65;group.add(dome);
    const lens=new THREE.Mesh(
      new THREE.SphereGeometry(0.06,8,8),
      new THREE.MeshPhongMaterial({color:0xff0033,emissive:0xff0033,emissiveIntensity:3})
    );
    lens.position.set(0,0.5,0.25);group.add(lens);
    const lensLight=new THREE.SpotLight(0xff0033,2,10,Math.PI/5,0.5,1);
    lensLight.position.set(0,0.5,0.2);
    lensLight.target.position.set(0,0,5);
    group.add(lensLight);group.add(lensLight.target);
    const cone=new THREE.Mesh(
      new THREE.ConeGeometry(1.5,5,16,1,true),
      new THREE.MeshBasicMaterial({color:0xff0033,transparent:true,opacity:0.06,side:THREE.DoubleSide,depthWrite:false})
    );
    cone.rotation.x=-Math.PI/2;cone.position.set(0,0.5,2.7);group.add(cone);
    for(let s=-1;s<=1;s+=2){
      const thruster=new THREE.Mesh(
        new THREE.CylinderGeometry(0.04,0.03,0.15,6),
        new THREE.MeshPhongMaterial({color:0x444,emissive:0xff3333,emissiveIntensity:0.5})
      );
      thruster.position.set(s*0.3,0.35,0);group.add(thruster);
    }
    const x=8+i*4,z=5+i*3;
    group.position.set(x,0,z);
    scene.add(group);
    enemies.push({
      mesh:group,cone:cone,lensLight:lensLight,alert:0,
      patrol:[{x,z},{x:x+6,z:z+3}],patrolIdx:0,wait:0,speed:1.5,
      angle:0,range:8,fov:Math.PI/4,type:'drone'
    });
  }
}

/* ================= STATIONS ================= */
function createStations(){
  for(let pos of [[-5,-5],[10,10]]){
    const group=new THREE.Group();
    const bench=new THREE.Mesh(
      new THREE.BoxGeometry(1.5,0.6,1),
      new THREE.MeshPhongMaterial({color:0x3a2f26,shininess:20})
    );
    bench.position.y=0.3;group.add(bench);
    const light=new THREE.PointLight(0xff6b35,0.8,5);
    light.position.set(0,1,0);group.add(light);
    group.position.set(pos[0],0,pos[1]);
    scene.add(group);
    stations.push({x:pos[0],z:pos[1],used:false,light:light,group:group});
  }
}

/* ================= INPUT ================= */
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gameState==='playing'){
    if(e.code==='Space') useFlux();
    if(e.code==='KeyE') interact();
  }
});
window.addEventListener('keyup',e=>keys[e.code]=false);

// Touch joystick
let stickActive=false,stickOrigin={x:0,y:0},stickCurrent={x:0,y:0};
const stickZone=document.getElementById('stick-zone');
const stickKnob=document.getElementById('stick-knob');
function handleStickStart(e){
  const touch=e.touches[0];
  const rect=stickZone.getBoundingClientRect();
  stickOrigin={x:rect.left+rect.width/2,y:rect.top+rect.height/2};
  stickCurrent={x:touch.clientX,y:touch.clientY};
  stickActive=true;updateStick();
}
function handleStickMove(e){
  if(!stickActive)return;
  const touch=e.touches[0];
  stickCurrent={x:touch.clientX,y:touch.clientY};updateStick();
}
function handleStickEnd(){stickActive=false;updateStick();}
function updateStick(){
  if(!stickActive){stickKnob.style.transform='translate(0,0)';return;}
  const dx=stickCurrent.x-stickOrigin.x,dy=stickCurrent.y-stickOrigin.y;
  const dist=Math.min(Math.sqrt(dx*dx+dy*dy),35);
  const angle=Math.atan2(dy,dx);
  stickKnob.style.transform=`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`;
}
stickZone.addEventListener('touchstart',handleStickStart,{passive:false});
stickZone.addEventListener('touchmove',handleStickMove,{passive:false});
stickZone.addEventListener('touchend',handleStickEnd);
stickZone.addEventListener('touchcancel',handleStickEnd);

function bindBtn(id,code){
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[code]=true;},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();keys[code]=false;},{passive:false});
  el.addEventListener('mousedown',()=>keys[code]=true);
  el.addEventListener('mouseup',()=>keys[code]=false);
  el.addEventListener('mouseleave',()=>keys[code]=false);
}
bindBtn('btn-dash','ShiftLeft');

function bindAction(id,fn){
  const el=document.getElementById(id);if(!el)return;
  let lastTap=0;
  const run=e=>{e.preventDefault();const now=Date.now();if(now-lastTap<200)return;lastTap=now;if(gameState==='playing')fn();};
  el.addEventListener('touchstart',run,{passive:false});
  el.addEventListener('click',run);
}
bindAction('btn-flux',useFlux);
bindAction('btn-interact',interact);

/* ================= ABILITIES ================= */
function useFlux(){
  if(player.flux>20){
    player.flux-=25;player.hidden=true;
    log('Flux smoke deployed.');beep(1320,0.06,0.05);
    // Simple smoke particles
    for(let i=0;i<20;i++){
      const s=new THREE.Mesh(
        new THREE.SphereGeometry(0.1+Math.random()*0.2,4,4),
        new THREE.MeshBasicMaterial({color:0x889988,transparent:true,opacity:0.1})
      );
      s.position.set(player.x+(Math.random()-0.5)*3,0.3+Math.random()*0.5,player.z+(Math.random()-0.5)*3);
      scene.add(s);
      setTimeout(()=>scene.remove(s),3000);
    }
    setTimeout(()=>player.hidden=false,4000);
  }
}

function interact(){
  for(let n of npcs){
    if(n.damaged&&!n.repaired&&Math.hypot(player.x-n.mesh.position.x,player.z-n.mesh.position.z)<2.5){
      startRepair(n);return;
    }
  }
  for(let s of stations){
    if(!s.used&&Math.hypot(player.x-s.x,player.z-s.z)<2.5){
      player.integrity=Math.min(100,player.integrity+30);
      player.signal=Math.min(100,player.signal+20);
      s.used=true;s.light.intensity=0.2;
      log('Rework bench engaged.');beep(440,0.3,0.08);
      return;
    }
  }
  for(let n of npcs){
    if(!n.damaged&&Math.hypot(player.x-n.mesh.position.x,player.z-n.mesh.position.z)<3){
      const dia=n.dialogues[Math.floor(Math.random()*n.dialogues.length)];
      log(n.name+': '+dia);return;
    }
  }
}

let currentRepairNPC=null;
function startRepair(npc){
  if(currentRepairNPC)return;
  currentRepairNPC=npc;npc.repairing=true;
  log('Reparando '+npc.name+'...');beep(440,0.1,0.08);
}

function updateRepair(dt){
  if(!currentRepairNPC)return;
  const n=currentRepairNPC;
  if(!n.repairing)return;
  if(Math.hypot(player.x-n.mesh.position.x,player.z-n.mesh.position.z)>3){
    n.repairing=false;n.repairProgress=0;currentRepairNPC=null;
    log('Reparación cancelada.');return;
  }
  n.repairProgress+=dt*30;
  if(n.repairProgress>=100)completeRepair(n);
}

function completeRepair(npc){
  npc.repairing=false;npc.repaired=true;npc.damaged=false;
  currentRepairNPC=null;
  npc.mesh.traverse(c=>{
    if(c.isMesh&&c.material&&c.material.emissive){
      c.material=c.material.clone();c.material.emissiveIntensity=1;
    }
  });
  player.scrap+=15;
  log(npc.name+' reparado! +SCRAP x15');beep(659,0.3,0.08);
  // Check all repaired
  if(npcs.filter(n=>n.damaged).every(n=>n.repaired)){
    log('¡TODOS REPARADOS! Ruta a PCB CITY desbloqueada.');
  }
}

function log(msg){
  const el=document.getElementById('gameLog');
  el.innerHTML='&gt; '+msg;
  el.style.borderLeftColor='#ff6b35';
  setTimeout(()=>el.style.borderLeftColor='#2a5a3a',400);
}

/* ================= UPDATE ================= */
const clock=new THREE.Clock();
function update(){
  if(gameState!=='playing')return;
  const dt=Math.min(clock.getDelta(),0.05);frame++;

  // Input
  let dx=0,dz=0;
  if(keys['KeyW']||keys['ArrowUp'])dz=-1;
  if(keys['KeyS']||keys['ArrowDown'])dz=1;
  if(keys['KeyA']||keys['ArrowLeft'])dx=-1;
  if(keys['KeyD']||keys['ArrowRight'])dx=1;
  if(stickActive){
    const sx=stickCurrent.x-stickOrigin.x,sy=stickCurrent.y-stickOrigin.y;
    const dist=Math.sqrt(sx*sx+sy*sy);
    if(dist>10){dx=sx/dist;dz=sy/dist;}
  }
  if(dx!==0||dz!==0){
    const len=Math.hypot(dx,dz);dx/=len;dz/=len;
    player.dir={x:dx,z:dz};
  }

  // Dash
  let spd=player.speed;
  if((keys['ShiftLeft']||keys['ShiftRight'])&&player.dashCooldown<=0&&player.signal>5){
    spd=player.dashSpeed;player.signal-=0.5;player.dashCooldown=15;
  }
  if(player.dashCooldown>0)player.dashCooldown--;

  // Move
  player.x+=dx*spd*dt;player.z+=dz*spd*dt;
  player.x=Math.max(-28,Math.min(28,player.x));
  player.z=Math.max(-28,Math.min(28,player.z));
  player.vx=dx*spd;player.vz=dz*spd;

  // Animate player
  player.mesh.position.set(player.x,0,player.z);
  if(dx!==0||dz!==0){
    player.walkTime+=dt*8;
    player.mesh.rotation.y=Math.atan2(dx,dz);
    player.mesh.position.y=Math.sin(player.walkTime)*0.06;
    player.cape.rotation.x=0.1+Math.sin(player.walkTime)*0.05;
  }else{
    player.walkTime=0;
    player.mesh.position.y=Math.sin(frame*0.05)*0.02;
  }

  // Camera follow - high angle Zelda style
  const camAngle=Math.atan2(player.dir.x,player.dir.z);
  const camDist=5.5;
  const camX=player.x+Math.sin(camAngle+Math.PI)*camDist;
  const camZ=player.z+Math.cos(camAngle+Math.PI)*camDist;
  camera.position.lerp(new THREE.Vector3(camX,5.5,camZ),0.1);
  camera.lookAt(player.x,0.3,player.z);

  // Items
  for(let it of items){
    if(it.taken)continue;
    it.mesh.rotation.y+=dt*2;
    it.mesh.position.y=0.4+Math.sin(frame*0.08+it.x)*0.1;
    if(Math.hypot(player.x-it.x,player.z-it.z)<1.2){
      it.taken=true;it.group.visible=false;
      beep(1320,0.06,0.05);
      if(it.type==='scrap'){player.scrap+=5;log('Scrap +5');}
      if(it.type==='flux'){player.flux=Math.min(100,player.flux+30);log('Flux +30');}
      if(it.type==='jumper'){player.integrity=Math.min(100,player.integrity+25);log('Jumper +25%');}
    }
  }

  // Enemies
  player.risk=0;let detected=false;
  for(let e of enemies){
    if(e.wait<=0){
      const target=e.patrol[e.patrolIdx];
      const d=Math.hypot(target.x-e.mesh.position.x,target.z-e.mesh.position.z);
      if(d<0.5){e.patrolIdx=(e.patrolIdx+1)%e.patrol.length;e.wait=40+Math.random()*30;}
      else{
        const ang=Math.atan2(target.x-e.mesh.position.x,target.z-e.mesh.position.z);
        e.mesh.position.x+=Math.sin(ang)*e.speed*dt;
        e.mesh.position.z+=Math.cos(ang)*e.speed*dt;
        e.mesh.rotation.y=ang;e.angle=ang;
      }
    }else{e.wait--;}
    const d=Math.hypot(player.x-e.mesh.position.x,player.z-e.mesh.position.z);
    let inCone=false;
    if(d<e.range){
      const angToP=Math.atan2(player.x-e.mesh.position.x,player.z-e.mesh.position.z);
      let diff=angToP-e.angle;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      if(Math.abs(diff)<e.fov/2)inCone=true;
    }
    if(inCone&&!player.hidden){
      detected=true;player.risk=Math.min(100,player.risk+(1-d/e.range)*50);
      e.alert=Math.min(100,e.alert+3);
      if(e.alert>70){player.integrity-=2*dt;}
      e.cone.material.opacity=0.12;
    }else{
      e.alert=Math.max(0,e.alert-1);
      e.cone.material.opacity=0.04;
    }
  }

  // NPC idle
  for(let i=0;i<npcs.length;i++){
    const n=npcs[i];
    n.mesh.position.y=Math.sin(frame*0.03+i*2)*0.03;
    if(n.type==='crystal'){
      n.mesh.children.forEach(c=>{
        if(c.geometry&&c.geometry.type==='TorusGeometry'){
          c.scale.setScalar(1+Math.sin(frame*0.1)*0.1);
        }
      });
    }
  }

  // Repair
  updateRepair(dt);

  // Recovery
  player.signal=Math.min(100,player.signal+0.02);
  if(player.hidden)player.risk=Math.max(0,player.risk-0.1);
  player.integrity=Math.max(0,Math.min(100,player.integrity));
  player.signal=Math.max(0,Math.min(100,player.signal));
  player.risk=Math.max(0,Math.min(100,player.risk));
  player.flux=Math.max(0,Math.min(100,player.flux));

  // HUD
  document.getElementById('barIntegrity').style.width=player.integrity+'%';
  document.getElementById('barSignal').style.width=player.signal+'%';
  document.getElementById('barRisk').style.width=player.risk+'%';
  document.getElementById('scrapCount').textContent=player.scrap;

  if(player.integrity<=0){player.integrity=0;log('RECHAZADO. PURGE.');gameState='gameover';}
}

/* ================= RENDER ================= */
function animate(){
  requestAnimationFrame(animate);
  if(gameState==='playing'){
    update();
    renderer.render(scene,camera);
  }
}

/* ================= GAME FLOW ================= */
function startGame(){
  initAudio();
  const menu=document.getElementById('menu-screen');
  const loading=document.getElementById('loading');
  const ui=document.getElementById('ui-layer');
  if(menu)menu.classList.add('hidden');
  if(loading)loading.classList.add('hidden');
  if(ui)ui.style.display='block';
  gameState='playing';
  log('Secuencia iniciada. Escapa del MRB Vault.');
  clock.start();
  animate();
}

// Loading simulation
let loadProgress=0;
let loadAttempts=0;
let threeInitialized=false;

function simulateLoad(){
  loadAttempts++;

  // Show skip button after 2 seconds
  if(loadAttempts>10){
    const skipBtn=document.getElementById('btn-skip');
    if(skipBtn)skipBtn.style.display='block';
  }

  // Try to init Three.js on first call
  if(!threeInitialized){
    try{
      threeInitialized=initThree();
      if(!threeInitialized){
        const status=document.getElementById('loading-status');
        if(status){status.textContent='WebGL no disponible. Modo fallback activado.';status.style.opacity=1;}
        // Continue anyway - will show menu
        setTimeout(showMenu,500);
        return;
      }
    }catch(e){
      const status=document.getElementById('loading-status');
      if(status){status.textContent='Error: '+e.message;status.style.opacity=1;}
      setTimeout(showMenu,500);
      return;
    }
  }

  loadProgress+=20;
  const fill=document.getElementById('loadingFill');
  if(fill)fill.style.width=loadProgress+'%';

  if(loadProgress<100){
    setTimeout(simulateLoad,150);
  }else{
    setTimeout(showMenu,300);
  }
}

function showMenu(){
  const loading=document.getElementById('loading');
  const menu=document.getElementById('menu-screen');
  if(loading)loading.classList.add('hidden');
  if(menu)menu.classList.remove('hidden');
}

// Skip button handler
document.getElementById('btn-skip').addEventListener('click',()=>{
  if(!threeInitialized){
    try{threeInitialized=initThree();}catch(e){}
  }
  showMenu();
});

// Start
simulateLoad();

document.getElementById('btn-start').addEventListener('click',startGame);

/* ================= RESIZE ================= */
window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
