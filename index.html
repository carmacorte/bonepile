<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BONEPILE - Industrial Sci-Fi Stealth Game. Play as R3-WORK, a reworked SOIC-16 chip, and survive in a PCB megastructure controlled by the IPC Authority.">
    <meta name="theme-color" content="#000000">
    <title>BONEPILE - R3-W0RK Protocol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #0f0;
            font-family: 'OCR A', 'Courier New', monospace;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #000 0%, #0a0a0a 100%);
            border: 2px solid #0f0;
        }

        #canvas3d {
            flex: 1;
            display: block;
            background: #000;
        }

        #hud {
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #0f0;
            padding: 12px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            font-size: 10px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stat-label {
            color: #0a0;
            text-transform: uppercase;
            font-size: 8px;
            letter-spacing: 1.5px;
        }

        .stat-bar {
            width: 100%;
            height: 5px;
            background: #1a1a1a;
            border: 1px solid #0f0;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            transition: width 0.2s ease;
            box-shadow: 0 0 4px currentColor;
        }

        .stat-value {
            color: #0f0;
            font-size: 8px;
        }

        #info {
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #0a0;
            padding: 6px 20px;
            font-size: 9px;
            color: #0a0;
            text-align: center;
            letter-spacing: 1px;
        }

        #debug {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #0f0;
            padding: 8px 12px;
            font-size: 8px;
            z-index: 5;
            color: #0f0;
            line-height: 1.5;
            max-width: 200px;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 100px);
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.01),
                rgba(0, 255, 0, 0.01) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 4;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #0f0;
            padding: 30px 50px;
            text-align: center;
            z-index: 20;
            font-size: 14px;
            color: #0f0;
            line-height: 1.8;
        }

        #loading.hidden {
            display: none;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: #1a1a1a;
            border: 1px solid #0f0;
            margin-top: 15px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            box-shadow: 0 0 8px #0f0;
            animation: pulse 0.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            #hud {
                grid-template-columns: repeat(3, 1fr);
                font-size: 9px;
            }

            #debug {
                font-size: 7px;
                padding: 6px 10px;
            }

            #info {
                font-size: 8px;
                padding: 4px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas3d"></canvas>
        <div id="hud">
            <div class="stat">
                <div class="stat-label">INTEGRIDAD</div>
                <div class="stat-bar"><div class="stat-fill" id="integrityFill" style="width: 100%; background: #0f0"></div></div>
                <div class="stat-value" id="integrityValue">100%</div>
            </div>
            <div class="stat">
                <div class="stat-label">SEÑAL</div>
                <div class="stat-bar"><div class="stat-fill" id="signalFill" style="width: 75%; background: #0ff"></div></div>
                <div class="stat-value" id="signalValue">75%</div>
            </div>
            <div class="stat">
                <div class="stat-label">RIESGO AOI</div>
                <div class="stat-bar"><div class="stat-fill" id="aoiFill" style="width: 20%; background: #f60"></div></div>
                <div class="stat-value" id="aoiValue">20%</div>
            </div>
            <div class="stat">
                <div class="stat-label">ESTADO</div>
                <div class="stat-bar"><div class="stat-fill" id="stateFill" style="width: 100%; background: #6f0"></div></div>
                <div class="stat-value" id="stateValue">MÓVIL</div>
            </div>
            <div class="stat">
                <div class="stat-label">FLUX</div>
                <div class="stat-bar"><div class="stat-fill" id="fluxFill" style="width: 60%; background: #f96"></div></div>
                <div class="stat-value" id="fluxValue">60%</div>
            </div>
        </div>
        <div id="info">
            A/D MOVER | SPACE SALTAR | SHIFT DASH | E HIDE | R REPARAR
        </div>
        <div id="debug"></div>
        <div class="scanline"></div>
        <div id="loading">
            <div>INICIALIZANDO R3-W0RK...</div>
            <div style="font-size: 11px; margin-top: 10px; color: #0a0;">CARGANDO PROTOCOLO DE SUPERVIVENCIA</div>
            <div class="loading-bar"><div class="loading-bar-fill"></div></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/GLTFLoader.min.js"></script>

    <script>
        // ===== CONFIG =====
        const CONFIG = {
            modelPaths: ['R3WORK.glb', './R3WORK.glb', '../R3WORK.glb'],
            worldBounds: { min: -8, max: 8 },
            stats: {
                health: 100,
                signal: 75,
                aoiRisk: 20,
                flux: 60
            }
        };

        // ===== SCENE SETUP =====
        const canvas = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / (window.innerHeight - 100),
            0.1,
            1000
        );
        camera.position.set(0, 2, 3);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight - 100);
        renderer.setClearColor(0x000000);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;

        // ===== LIGHTING =====
        const ambientLight = new THREE.AmbientLight(0x666666);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x00ff00, 0.5);
        pointLight.position.set(0, 2, 2);
        scene.add(pointLight);

        // ===== GROUND =====
        const groundGeom = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x0a1a0a,
            metalness: 0.3,
            roughness: 0.7
        });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        ground.position.y = -0.1;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20, 0x00ff00, 0x003300);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // ===== GAME STATE =====
        const gameState = {
            model: null,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            speed: 0.05,
            dashing: false,
            hidden: false,
            state: 'IDLE',
            health: CONFIG.stats.health,
            signal: CONFIG.stats.signal,
            aoiRisk: CONFIG.stats.aoiRisk,
            flux: CONFIG.stats.flux,
            animTime: 0,
            direction: 1,
            frameCount: 0
        };

        // ===== LOAD MODEL =====
        const loader = new THREE.GLTFLoader();
        let modelLoaded = false;

        function loadModel(paths, index = 0) {
            if (index >= paths.length) {
                showError('No se encontró R3WORK.glb. Asegúrate de que el archivo esté en el mismo directorio.');
                return;
            }

            loader.load(
                paths[index],
                onModelLoaded,
                onProgress,
                () => loadModel(paths, index + 1)
            );
        }

        function onModelLoaded(gltf) {
            modelLoaded = true;
            gameState.model = gltf.scene;
            gameState.model.position.set(0, 0, 0);
            gameState.model.scale.set(1, 1, 1);
            gameState.model.castShadow = true;
            gameState.model.receiveShadow = true;

            gameState.model.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            scene.add(gameState.model);
            document.getElementById('loading').classList.add('hidden');
            animate();
        }

        function onProgress(event) {
            if (event.lengthComputable) {
                const progress = (event.loaded / event.total) * 100;
                document.querySelector('.loading-bar-fill').style.width = progress + '%';
            }
        }

        function showError(msg) {
            document.getElementById('loading').innerHTML = `
                <div style="color: #f60;">ERROR</div>
                <div style="font-size: 11px; margin-top: 10px;">${msg}</div>
            `;
        }

        // ===== INPUT =====
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                jump();
            }
            if (e.key.toLowerCase() === 'shift') {
                dash();
            }
            if (e.key.toLowerCase() === 'e') {
                toggleHide();
            }
            if (e.key.toLowerCase() === 'r') {
                repair();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ===== ABILITIES =====
        function jump() {
            if (gameState.model) {
                gameState.model.position.y += 0.3;
                setTimeout(() => {
                    if (gameState.model) gameState.model.position.y = 0;
                }, 200);
            }
        }

        function dash() {
            if (gameState.flux > 20 && !gameState.dashing) {
                gameState.dashing = true;
                gameState.flux = Math.max(0, gameState.flux - 25);
                setTimeout(() => {
                    gameState.dashing = false;
                }, 300);
            }
        }

        function toggleHide() {
            gameState.hidden = !gameState.hidden;
        }

        function repair() {
            if (gameState.flux > 10) {
                gameState.health = Math.min(100, gameState.health + 30);
                gameState.flux = Math.max(0, gameState.flux - 15);
            }
        }

        // ===== UPDATE =====
        function update() {
            if (!gameState.model) return;

            gameState.frameCount++;

            // Movement
            gameState.vx = 0;
            if (keys['a'] || keys['arrowleft']) {
                gameState.vx = -gameState.speed;
                gameState.direction = -1;
            }
            if (keys['d'] || keys['arrowright']) {
                gameState.vx = gameState.speed;
                gameState.direction = 1;
            }

            gameState.x += gameState.vx;
            gameState.x = Math.max(CONFIG.worldBounds.min, Math.min(CONFIG.worldBounds.max, gameState.x));
            gameState.model.position.x = gameState.x;

            // State machine
            if (Math.abs(gameState.vx) > 0.01) {
                gameState.state = 'WALK';
                gameState.animTime += 0.05;
            } else {
                gameState.state = 'IDLE';
                gameState.animTime = 0;
            }

            if (gameState.dashing) {
                gameState.state = 'DASH';
            }

            if (gameState.hidden) {
                gameState.state = 'HIDE';
            }

            // Stat degradation
            if (gameState.state === 'WALK') {
                gameState.health -= 0.01;
                gameState.aoiRisk += 0.005;
            }
            if (gameState.state === 'DASH') {
                gameState.health -= 0.03;
                gameState.aoiRisk += 0.02;
                gameState.flux -= 0.02;
            }

            // Recovery
            gameState.signal = Math.min(100, gameState.signal + 0.01);
            if (gameState.hidden) {
                gameState.aoiRisk = Math.max(0, gameState.aoiRisk - 0.05);
            }

            // Clamp
            gameState.health = Math.max(0, Math.min(100, gameState.health));
            gameState.signal = Math.max(0, Math.min(100, gameState.signal));
            gameState.aoiRisk = Math.max(0, Math.min(100, gameState.aoiRisk));
            gameState.flux = Math.max(0, Math.min(100, gameState.flux));

            // Model animation
            gameState.model.rotation.y = gameState.direction === 1 ? 0 : Math.PI;

            if (gameState.state === 'IDLE') {
                gameState.model.position.y = Math.sin(Date.now() * 0.001) * 0.1;
            }

            if (gameState.state === 'WALK') {
                gameState.model.position.y = Math.sin(gameState.animTime) * 0.15;
            }

            if (gameState.dashing) {
                gameState.x += gameState.direction * 0.3;
                gameState.model.position.x = gameState.x;
                gameState.model.position.y = Math.cos(Date.now() * 0.01) * 0.2;
            }

            if (gameState.hidden) {
                gameState.model.scale.set(0.7, 0.7, 0.7);
                gameState.model.position.y = -0.3;
            } else {
                gameState.model.scale.set(1, 1, 1);
            }

            updateHUD();
            updateDebug();
        }

        // ===== HUD =====
        function updateHUD() {
            document.getElementById('integrityFill').style.width = gameState.health + '%';
            document.getElementById('integrityValue').textContent = Math.round(gameState.health) + '%';

            document.getElementById('signalFill').style.width = gameState.signal + '%';
            document.getElementById('signalValue').textContent = Math.round(gameState.signal) + '%';

            document.getElementById('aoiFill').style.width = gameState.aoiRisk + '%';
            document.getElementById('aoiValue').textContent = Math.round(gameState.aoiRisk) + '%';

            document.getElementById('stateValue').textContent = gameState.state;

            document.getElementById('fluxFill').style.width = gameState.flux + '%';
            document.getElementById('fluxValue').textContent = Math.round(gameState.flux) + '%';
        }

        function updateDebug() {
            const debug = document.getElementById('debug');
            debug.innerHTML = `
FRAME: ${gameState.frameCount}<br>
POS: ${gameState.x.toFixed(2)}<br>
STATE: ${gameState.state}<br>
HIDDEN: ${gameState.hidden ? 'YES' : 'NO'}<br>
HEALTH: ${Math.round(gameState.health)}%<br>
FLUX: ${Math.round(gameState.flux)}%
            `;
        }

        // ===== ANIMATION LOOP =====
        function animate() {
            update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ===== RESPONSIVE =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 100);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 100);
        });

        // ===== START =====
        loadModel(CONFIG.modelPaths);
    </script>
</body>
</html>
