<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BONEPILE 64 — R3-W0RK N64 Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; user-select: none; }
  html, body {
    background: #050508; color: #fff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden; width: 100vw; height: 100vh;
  }
  
  /* Contenedor principal de la pantalla estilo CRT / N64 */
  #game-container {
    position: absolute; top: 50%; left: 50%;
    width: 960px; height: 640px;
    transform: translate(-50%, -50%);
    border: 12px solid #2a2b30;
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    background: #000;
    overflow: hidden;
  }

  /* Renderizador con pixelación forzada */
  canvas {
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Interfaz estilo Conker's / Rareware N64 */
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .hud-top {
    display: flex; justify-content: space-between; width: 100%;
  }

  .n64-bar-container {
    background: rgba(0,0,0,0.6); padding: 8px 15px; border: 3px solid #edaf22;
    border-radius: 4px; box-shadow: 3px 3px 0px #000;
  }

  .n64-title {
    color: #edaf22; font-size: 18px; font-weight: bold; text-transform: uppercase;
    text-shadow: 2px 2px 0px #000; margin-bottom: 4px;
  }

  .bar-outer {
    width: 200px; height: 16px; background: #222; border: 2px solid #fff; overflow: hidden;
  }
  .bar-inner {
    height: 100%; width: 100%; background: #00ff66; transition: width 0.2s;
  }
  .bar-inner.signal { background: #00ccff; }

  .hud-bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
  }

  .counter-box {
    background: rgba(0,0,0,0.7); border: 3px solid #ff5555; padding: 10px;
    font-size: 22px; color: #fff; font-weight: bold; text-shadow: 2px 2px 0px #000;
    box-shadow: 4px 4px 0px #000; border-radius: 4px;
  }

  /* Log de eventos con estilo de terminal industrial de los 90 */
  #gameLog {
    background: rgba(10,12,18,0.85); border-left: 5px solid #edaf22;
    padding: 10px; font-size: 13px; color: #00ff66; width: 350px;
    box-shadow: 3px 3px 8px rgba(0,0,0,0.5);
  }

  /* Superposición CRT para simular tubo de televisión antiguo */
  #crt-overlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 10;
  }

  /* Pantalla de inicio estilo Rareware boot screen */
  #boot-screen {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: #050508; z-index: 100; display: flex; flex-direction: column;
    justify-content: center; align-items: center; transition: opacity 0.5s ease;
  }

  .boot-logo {
    font-size: 56px; font-weight: bold; color: #ff5500; text-shadow: 4px 4px 0px #000;
    letter-spacing: 4px; margin-bottom: 20px; text-transform: uppercase;
    border: 5px solid #ff5500; padding: 10px 30px; transform: rotate(-3deg);
  }

  .boot-text {
    font-size: 16px; color: #888; text-transform: uppercase; letter-spacing: 2px;
  }
</style>

<!-- Cargar Three.js y dependencias críticas para manejo de GLB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="game-container">
  <div id="crt-overlay"></div>
  
  <!-- Pantalla de Carga/Boot de Rareware -->
  <div id="boot-screen">
    <div class="boot-logo">BONEPILE 64</div>
    <div class="boot-text">Cargando modulo SOIC-16 (R3WORK.glb)...</div>
  </div>

  <!-- Contenedor del Canvas WebGL -->
  <div id="canvas-holder" style="width:100%; height:100%;"></div>

  <!-- HUD del juego -->
  <div id="hud">
    <div class="hud-top">
      <div class="n64-bar-container">
        <div class="n64-title">Integridad R3-WORK</div>
        <div class="bar-outer"><div id="hp-bar" class="bar-inner"></div></div>
      </div>
      <div class="n64-bar-container">
        <div class="n64-title">Calidad de Señal</div>
        <div class="bar-outer"><div id="signal-bar" class="bar-inner signal"></div></div>
      </div>
    </div>

    <div class="hud-bottom">
      <div id="gameLog">> SMT CONTROL CENTER INITIALIZED. ESPERANDO ENTRADA...</div>
      <div class="counter-box">
        SCRAP: <span id="scrap-count">00</span>
      </div>
    </div>
  </div>
</div>

<script>
  /* ================= CONFIGURACIÓN N64 ENGINE ================= */
  const HOLDER = document.getElementById('canvas-holder');
  let scene, camera, renderer, clock;
  let playerModel = null, mixer = null;
  let moveDirection = { x: 0, z: 0 };
  let playerPhysics = { x: 0, y: 0, z: 0, rotation: 0, speed: 0.15 };
  let keys = {};
  
  // Configuración de baja resolución artificial para simular el hardware N64 (320x240 escalado)
  const N64_WIDTH = 480;
  const N64_HEIGHT = 320;

  function init() {
    // 1. Crear Escena y Reloj
    scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0e14');
    scene.fog = new THREE.FogExp2('#0b0e14', 0.05);
    clock = new THREE.Clock();

    // 2. Cámara con lente de la época (FOV intermedio)
    camera = new THREE.PerspectiveCamera(60, N64_WIDTH / N64_HEIGHT, 0.1, 1000);

    // 3. Renderizador WebGL con deshabilitación de Antialiasing para forzar bordes pixelados
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(N64_WIDTH, N64_HEIGHT);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap; // Sombras pixeladas retro
    HOLDER.appendChild(renderer.domElement);

    // Ajustar estilos para que ocupe todo el espacio escalado por CSS
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    // 4. Iluminación Directa / Vértices (Muted & Industrial)
    const ambientLight = new THREE.AmbientLight('#223344', 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight('#ffaa44', 2.0);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 256; // Mapa de sombras de baja resolución estilo N64
    dirLight.shadow.mapSize.height = 256;
    scene.add(dirLight);

    // Luz de emergencia parpadeante del nivel
    const pointLight = new THREE.PointLight('#ff0033', 3, 30);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    // 5. Construcción del Entorno de Manufactura (Placa PCB Tridimensional)
    buildPCBWorld();

    // 6. Carga del archivo R3WORK.glb desde la raíz del repositorio o carga local
    loadPlayerModel();

    // 7. Eventos de Control
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Iniciar bucle de renderizado
    animate();
  }

  /* ================= MUNDO TRIDIMENSIONAL RETRO ================= */
  function buildPCBWorld() {
    // El suelo es una gran placa verde de circuito impreso
    const pcbGeo = new THREE.BoxGeometry(200, 2, 200);
    
    // Crear una textura procedural pixelada rápida para el suelo
    const canvasTexture = document.createElement('canvas');
    canvasTexture.width = 64; canvasTexture.height = 64;
    const ctxTex = canvasTexture.getContext('2d');
    ctxTex.fillStyle = '#123a24'; ctxTex.fillRect(0,0,64,64);
    ctxTex.fillStyle = '#1b5235';
    for(let i=0; i<8; i++) { ctxTex.fillRect(i*8, 0, 2, 64); ctxTex.fillRect(0, i*8, 64, 2); }
    
    const texture = new THREE.CanvasTexture(canvasTexture);
    texture.magFilter = THREE.NearestFilter; // Filtrado retro sin suavizado moderno
    texture.minFilter = THREE.NearestFilter;
    texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(10, 10);

    const pcbMat = new THREE.MeshLambertMaterial({ map: texture });
    const pcbFloor = new THREE.Mesh(pcbGeo, pcbMat);
    pcbFloor.position.y = -1;
    pcbFloor.receiveShadow = true;
    scene.add(pcbFloor);

    // Añadir componentes volumétricos (obstáculos tipo Conker's)
    // Capacitadores Cilíndricos
    const capGeo = new THREE.CylinderGeometry(3, 3, 12, 8); // Bajos polígonos
    const capMat = new THREE.MeshLambertMaterial({ color: '#2255cc' });
    
    for(let i=0; i<15; i++) {
      const capacitor = new THREE.Mesh(capGeo, capMat);
      capacitor.position.set(Math.random()*120 - 60, 6, Math.random()*120 - 60);
      if (Math.abs(capacitor.position.x) < 15 && Math.abs(capacitor.position.z) < 15) {
        capacitor.position.x += 25; // Evitar que caiga encima del spawn del jugador
      }
      capacitor.castShadow = true;
      capacitor.receiveShadow = true;
      scene.add(capacitor);
    }

    // Resistores con bandas de colores
    const resGeo = new THREE.BoxGeometry(16, 4, 4);
    const resMat = new THREE.MeshLambertMaterial({ color: '#d2b48c' });
    for(let i=0; i<10; i++) {
      const resistor = new THREE.Mesh(resGeo, resMat);
      resor_x = Math.random()*140 - 70;
      resor_z = Math.random()*140 - 70;
      resistor.position.set(resor_x, 2, resor_z);
      resistor.rotation.y = Math.random() * Math.PI;
      resistor.castShadow = true;
      scene.add(resistor);
    }
  }

  /* ================= CARGA DE ASSETS (R3WORK.glb) ================= */
  function loadPlayerModel() {
    const loader = new THREE.GLTFLoader();
    
    // Intentar cargar el archivo local cargado por el usuario
    loader.load('R3WORK.glb', 
      function (gltf) {
        playerModel = gltf.scene;
        playerModel.scale.set(4, 4, 4); // Escalar al tamaño del mundo
        playerModel.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            // Forzar material Lambert o Toon para mantener el look N64
            if(node.material) {
              node.material.roughness = 1.0;
              if (node.material.map) {
                node.material.map.magFilter = THREE.NearestFilter;
                node.material.map.minFilter = THREE.NearestFilter;
              }
            }
          }
        });
        
        scene.add(playerModel);
        
        // Configurar animaciones si el modelo las incluye
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(playerModel);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        // Ocultar pantalla de boot
        document.getElementById('boot-screen').style.opacity = '0';
        setTimeout(() => { document.getElementById('boot-screen').style.display = 'none'; }, 500);
        document.getElementById('gameLog').innerHTML = '> R3-WORK CON GLB CARGADO CORRECTAMENTE. CORRIENDO A 240p.';
      },
      function (xhr) {
        console.log((xhr.loaded / xhr.total * 100) + '% cargado');
      },
      function (error) {
        console.warn('No se pudo encontrar R3WORK.glb en la raíz, generando modelo procedural low-poly para desarrollo...');
        createProceduralN64Player();
      }
    );
  }

  // Respaldo de contingencia: Crea un microchip articulado en Low-Poly si el GLB no responde inmediatamente
  function createProceduralN64Player() {
    playerModel = new THREE.Group();
    
    // Cuerpo SOIC-16 (Caja plana negra)
    const bodyGeo = new THREE.BoxGeometry(4, 1.5, 4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: '#1a1a1a' });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.y = 1.5;
    playerModel.add(bodyMesh);

    // Patas articuladas (Pines doblados)
    const legGeo = new THREE.BoxGeometry(0.4, 2, 0.4);
    const legMat = new THREE.MeshLambertMaterial({ color: '#cccccc' });

    for(let i = 0; i < 4; i++) {
      // Izquierda
      const legL = new THREE.Mesh(legGeo, legMat);
      legL.position.set(-2.2, 0.8, -1.5 + i*1.0);
      legL.rotation.z = 0.3;
      playerModel.add(legL);

      // Derecha
      const legR = new THREE.Mesh(legGeo, legMat);
      legR.position.set(2.2, 0.8, -1.5 + i*1.0);
      legR.rotation.z = -0.3;
      playerModel.add(legR);
    }

    scene.add(playerModel);
    
    // Quitar pantalla de carga
    document.getElementById('boot-screen').style.opacity = '0';
    setTimeout(() => { document.getElementById('boot-screen').style.display = 'none'; }, 500);
  }

  /* ================= LOOP DE ANIMACIÓN Y FÍSICAS N64 ================= */
  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    if (mixer) mixer.update(delta);

    // Procesar Entrada de Controles (WASD / Flechas)
    moveDirection.x = 0;
    moveDirection.z = 0;

    if (keys['KeyW'] || keys['ArrowUp']) moveDirection.z = -1;
    if (keys['KeyS'] || keys['ArrowDown']) moveDirection.z = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDirection.x = -1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDirection.x = 1;

    // Actualizar posición y rotación del personaje
    if (playerModel) {
      if (moveDirection.x !== 0 || moveDirection.z !== 0) {
        // Calcular ángulo de movimiento basado en la dirección
        const targetRotation = Math.atan2(moveDirection.x, moveDirection.z);
        
        // Interpolación de rotación rígida estilo retro
        playerModel.rotation.y = targetRotation;

        // Mover personaje en el plano de la PCB
        playerPhysics.x += moveDirection.x * playerPhysics.speed;
        playerPhysics.z += moveDirection.z * playerPhysics.speed;

        // Animación procedural de balanceo de patas (Bobbing) estilo Conker
        playerModel.position.y = Math.abs(Math.sin(time * 12)) * 0.4;
        playerModel.rotation.z = Math.sin(time * 12) * 0.08;
      } else {
        // Volver suavemente al suelo al estar detenido
        playerModel.position.y = THREE.MathUtils.lerp(playerModel.position.y, 0, 0.1);
        playerModel.rotation.z = THREE.MathUtils.lerp(playerModel.rotation.z, 0, 0.1);
      }

      // Aplicar coordenadas físicas al objeto tridimensional
      playerModel.position.x = playerPhysics.x;
      playerModel.position.z = playerPhysics.z;

      // 8. Control de Cámara en 3ª Persona (Fija detrás con elasticidad)
      const camOffset = new THREE.Vector3(0, 12, 18);
      const targetCamPosition = playerModel.position.clone().add(camOffset);
      camera.position.lerp(targetCamPosition, 0.08); // Suavizado de seguimiento de cámara
      camera.lookAt(playerModel.position.clone().add(new THREE.Vector3(0, 2, 0)));
    }

    // Efecto de parpadeo de luces ambientales para la atmósfera industrial
    const ambientPulse = 1.2 + Math.sin(time * 4) * 0.2;
    scene.children.forEach(child => {
      if(child.isPointLight) child.intensity = 2 + Math.sin(time * 15) * 1.5;
    });

    // Simular pérdida superficial de señal en el HUD de manera aleatoria
    if (Math.random() < 0.02) {
      const currentSignal = Math.floor(80 + Math.random() * 20);
      document.getElementById('signal-bar').style.width = currentSignal + '%';
    }

    // Renderizar escena
    renderer.render(scene, camera);
  }

  // Inicializar al cargar la ventana
  window.onload = init;
</script>
</body>
</html>
